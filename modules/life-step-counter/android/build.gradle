plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lifestepcounter'
version = '1.0.0'

android {
  namespace "expo.modules.lifestepcounter"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Runs the step reader every 15 minutes, even when the app is closed
  implementation "androidx.work:work-runtime:2.9.1"
}
